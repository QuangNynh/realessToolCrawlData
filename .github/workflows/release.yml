name: Release CrawlData

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.cjs
      - run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - run: node scripts/verify-release-artifacts.cjs win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/CrawlData-Setup-*.exe
            release/CrawlData-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-tag.cjs
      - name: Require macOS signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-mac-signing.cjs
      - name: Build signed and notarized macOS release
        run: |
          npm run build
          node scripts/prepare-yt-dlp.cjs mac
          npx electron-builder --mac dmg zip --arm64 --publish never --config.mac.notarize=true
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/CrawlData.app
          node scripts/verify-release-artifacts.cjs mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/CrawlData-*.dmg
            release/CrawlData-*.dmg.blockmap
            release/CrawlData-*-mac.zip
            release/CrawlData-*-mac.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release-assets
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "CrawlData $GITHUB_REF_NAME" --generate-notes --verify-tag
